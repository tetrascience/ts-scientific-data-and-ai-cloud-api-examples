[tool.poetry]
name = "ts-scientific-data-cloud-api-examples"
version = "0.1.0"
description = "TetraScience Scientific Data and AI Cloud API Usage Examples"
authors = ["TetraScience"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
pandas = "^2.0.3"
xlsxwriter = "^3.1.2"
aiohttp-retry = "^2.9.1"
matplotlib = "^3.10.8"
numpy = "^2.2"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.24.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
